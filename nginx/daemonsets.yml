kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: nginx-daemon
  namespace: nginx
spec:
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      name: nginx-daemon-pod 
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
        
